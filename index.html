<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>EnglishOil — английский для нефтегаза</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --paper: #E9EEE9;
  --surface: #F7F9F5;
  --ink: #12242C;
  --muted: #55666D;
  --line: #C3CEC9;
  --accent: #F4B400;
  --on-accent: #12242C;
  --good: #17724A;
  --good-bg: #D9EEE0;
  --bad: #B3321D;
  --bad-bg: #F6DBD4;
  --pick-bg: #DDE7EA;
  --steel: #7B8F97;
  --rock-a: #D5DDD8;
  --rock-b: #DFE6E1;
  --bore-void: #F7F9F5;
  --bore-fill: #12242C;
  --focus: #0B5FD6;
  --edge: #12242C;

  --t-drill: #8A5A2B;
  --t-prod: #2E7D5B;
  --t-refin: #C9651B;
  --t-chem: #3564B0;
  --t-hse: #B8322A;
  --t-comm: #6B5B95;

  --f-display: "Bahnschrift", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", "Franklin Gothic Medium", system-ui, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1A20; --surface: #15262E; --ink: #E6EEEA; --muted: #92A5AC; --line: #2B414B;
    --good: #57C892; --good-bg: #123626; --bad: #F28B76; --bad-bg: #3D1C16; --pick-bg: #1F3944;
    --steel: #607A84; --rock-a: #16272E; --rock-b: #1C3039; --bore-void: #0D1A20; --bore-fill: #D6E2DD;
    --focus: #7DB2FF; --edge: #86A0A9;
    --t-drill: #C58B52; --t-prod: #4DBB8B; --t-refin: #E8904D; --t-chem: #6F9BE0; --t-hse: #EE7C73; --t-comm: #A597D0;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1A20; --surface: #15262E; --ink: #E6EEEA; --muted: #92A5AC; --line: #2B414B;
  --good: #57C892; --good-bg: #123626; --bad: #F28B76; --bad-bg: #3D1C16; --pick-bg: #1F3944;
  --steel: #607A84; --rock-a: #16272E; --rock-b: #1C3039; --bore-void: #0D1A20; --bore-fill: #D6E2DD;
  --focus: #7DB2FF; --edge: #86A0A9;
  --t-drill: #C58B52; --t-prod: #4DBB8B; --t-refin: #E8904D; --t-chem: #6F9BE0; --t-hse: #EE7C73; --t-comm: #A597D0;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1.0625rem;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.15; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 0.75em; }
b, strong { font-weight: 700; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }

/* Верхняя панель */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper);
  border-bottom: 2px solid var(--edge);
}
.top-in { max-width: 640px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 0; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; color: var(--ink); }
.brand svg { width: 26px; height: 26px; flex: none; }
.back { background: none; border: 0; padding: 10px 6px 10px 0; font-weight: 600; min-height: 44px; display: flex; align-items: center; gap: 4px; color: var(--ink); }
.top-title { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; text-align: right; }
.lvl-badge { font-family: var(--f-display); font-weight: 700; background: var(--ink); color: var(--paper); border-radius: 4px; padding: 4px 10px; font-size: 1.05rem; }

main { display: block; padding-top: 20px; outline: none; }
.stack > * + * { margin-top: 20px; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.en { font-family: var(--f-body); }

/* Кнопки */
.btn {
  display: flex; align-items: center; justify-content: center; text-align: center; gap: 8px;
  width: 100%; min-height: 56px; padding: 12px 18px;
  background: var(--accent); color: var(--on-accent);
  border: 2px solid var(--edge); border-radius: 6px;
  font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; line-height: 1.15;
  box-shadow: 0 4px 0 var(--edge);
  transition: transform 0.08s, box-shadow 0.08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn span { display: block; }
.btn small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }
.btn-ghost { background: transparent; color: var(--ink); box-shadow: none; }
.btn-ghost:active { transform: none; background: var(--pick-bg); }
.btn-sm { min-height: 44px; font-size: 1rem; padding: 8px 14px; box-shadow: none; width: auto; }
.btn-sm:active { transform: none; }
.btn-danger { background: transparent; color: var(--bad); border-color: var(--bad); box-shadow: none; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.btn-row { display: flex; gap: 12px; }
.btn-row .btn { flex: 1; }
.linkbtn { background: none; border: 0; padding: 10px 0; min-height: 44px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; text-align: left; }

/* Блоки */
.block { border: 2px solid var(--edge); border-radius: 6px; background: var(--surface); padding: 16px; }
.block.soft { border: 1.5px solid var(--line); }
.note-warn { border-left: 8px solid var(--accent); }
.kicker { font-family: var(--f-display); font-weight: 600; color: var(--muted); font-size: 1rem; }

/* Приветствие */
.hello h1 { font-size: 2.4rem; }
.hello .date { color: var(--muted); margin-top: 2px; }
.streak { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 600; }
.streak i { display: inline-block; width: 12px; height: 12px; background: var(--accent); border: 2px solid var(--edge); border-radius: 2px; }
.quote { margin: 14px 0 0; }

/* Полоса уровней */
.lvl-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lvl-btn {
  position: relative; min-height: 64px; padding: 8px 2px 10px; text-align: center;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 6px;
  font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.lvl-btn .mini { display: block; width: 70%; height: 5px; background: var(--line); border-radius: 2px; overflow: hidden; }
.lvl-btn .mini i { display: block; height: 100%; background: var(--ink); }
.lvl-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lvl-btn[aria-pressed="true"] .mini { background: rgba(255,255,255,0.28); }
.lvl-btn[aria-pressed="true"] .mini i { background: var(--accent); }
.lvl-btn .mine { position: absolute; top: -9px; right: -2px; background: var(--accent); color: var(--on-accent); border: 2px solid var(--edge); border-radius: 3px; font-family: var(--f-body); font-size: 0.68rem; font-weight: 700; padding: 0 4px; line-height: 1.3; }
.section-title { margin-bottom: 10px; }

/* Меню-список */
.menu { list-style: none; margin: 0; padding: 0; border: 2px solid var(--edge); border-radius: 6px; background: var(--surface); overflow: hidden; }
.menu li + li { border-top: 1.5px solid var(--line); }
.menu button { display: grid; grid-template-columns: 32px 1fr 20px; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 16px; background: none; border: 0; text-align: left; }
.menu button:active { background: var(--pick-bg); }
.menu svg { width: 28px; height: 28px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.menu .m-t { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; line-height: 1.1; }
.menu .m-d { display: block; color: var(--muted); font-size: 0.9rem; }
.menu .chev { stroke: var(--muted); width: 20px; height: 20px; }

/* Метки тем */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.tag::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--tc, var(--muted)); flex: none; }
.tag[data-t="drill"] { --tc: var(--t-drill); }
.tag[data-t="prod"] { --tc: var(--t-prod); }
.tag[data-t="refin"] { --tc: var(--t-refin); }
.tag[data-t="chem"] { --tc: var(--t-chem); }
.tag[data-t="hse"] { --tc: var(--t-hse); }
.tag[data-t="comm"] { --tc: var(--t-comm); }

/* Прогресс-полоса */
.bar { height: 10px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); }
.bar.acc > i { background: var(--accent); box-shadow: inset 0 0 0 1px var(--ink); }

/* Ход занятия: колонна бурильных труб */
.track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.track .seg { border-top: 10px solid var(--line); padding-top: 4px; font-size: 0.8rem; color: var(--muted); font-weight: 600; text-align: center; }
.track .seg.done { border-top-color: var(--ink); color: var(--ink); }
.track .seg.now { border-top-color: var(--accent); box-shadow: 0 -2px 0 var(--ink), 0 2px 0 -1px transparent; color: var(--ink); }

/* Слова */
.wcard { text-align: left; }
.wcard .word { font-family: var(--f-display); font-weight: 700; font-size: 2.6rem; line-height: 1.05; overflow-wrap: anywhere; }
.wcard .ipa { color: var(--muted); font-size: 1.15rem; margin-top: 4px; }
.wcard .ru { font-size: 1.5rem; font-weight: 600; margin-top: 14px; line-height: 1.25; }
.wcard .exb { margin-top: 16px; padding-top: 14px; border-top: 1.5px solid var(--line); }
.wcard .exb .e { font-size: 1.15rem; }
.wcard .exb .r { color: var(--muted); margin-top: 4px; }
mark, .hl b { background: none; color: inherit; }
.hl b { box-shadow: inset 0 -0.45em 0 color-mix(in srgb, var(--accent) 55%, transparent); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pager .cnt { font-weight: 600; color: var(--muted); }

/* Вопросы */
.q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.q-prompt { font-family: var(--f-display); font-size: 2rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.q-prompt.long { font-family: var(--f-body); font-weight: 600; font-size: 1.25rem; line-height: 1.4; }
.q-sub { color: var(--muted); margin-top: 6px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt {
  display: flex; align-items: center; text-align: left; width: 100%; min-height: 56px; padding: 12px 16px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 6px;
  font-size: 1.1rem; line-height: 1.3; overflow-wrap: anywhere;
}
.opt:active:not([disabled]) { background: var(--pick-bg); }
.opt.picked { border-color: var(--ink); background: var(--pick-bg); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt[disabled] { cursor: default; }
.opt .mark { margin-left: auto; padding-left: 12px; font-weight: 700; white-space: nowrap; font-size: 0.95rem; }
.opt.right .mark { color: var(--good); }
.opt.wrong .mark { color: var(--bad); }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 6px; border-left: 8px solid var(--line); background: var(--surface); }
.fb.ok { border-left-color: var(--good); }
.fb.no { border-left-color: var(--bad); }
.fb .t { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.fb.ok .t { color: var(--good); }
.fb.no .t { color: var(--bad); }
.fb p { margin: 6px 0 0; }
.ctx { margin-bottom: 16px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); }
.ctx summary { padding: 12px 14px; font-weight: 600; min-height: 44px; cursor: pointer; }
.ctx .ctx-body { padding: 0 14px 14px; font-size: 1.05rem; line-height: 1.6; }

/* Сопоставление */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.mbtn { min-height: 56px; padding: 8px 10px; text-align: center; background: var(--surface); border: 2px solid var(--line); border-radius: 6px; font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
.mbtn.sel { border-color: var(--ink); background: var(--pick-bg); }
.mbtn.done { border-color: var(--good); background: var(--good-bg); color: var(--good); cursor: default; }
.mbtn.flash { border-color: var(--bad); background: var(--bad-bg); animation: shake 0.3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* Текст для чтения */
.reading { font-size: 1.15rem; line-height: 1.7; }
.reading-title { margin-bottom: 4px; }
.keys { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.keys li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.keys .k { font-weight: 700; }
.keys .v { color: var(--muted); text-align: right; }

/* Грамматика */
.rule { line-height: 1.6; }
.exs { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.exs li { border-left: 4px solid var(--accent); padding-left: 12px; }
.exs .e { font-size: 1.1rem; }
.exs .r { color: var(--muted); font-size: 0.95rem; }

/* Словарь */
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { min-height: 44px; border: 2px solid var(--edge); border-radius: 6px; background: transparent; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 0.95rem; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.search { width: 100%; min-height: 48px; padding: 8px 14px; border: 2px solid var(--line); border-radius: 6px; background: var(--surface); }
.search:focus { border-color: var(--ink); }
.wlist { list-style: none; margin: 0; padding: 0; border: 2px solid var(--edge); border-radius: 6px; background: var(--surface); overflow: hidden; }
.wlist > li + li { border-top: 1.5px solid var(--line); }
.wrow { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; width: 100%; padding: 12px 14px; background: none; border: 0; text-align: left; min-height: 60px; }
.wrow:active { background: var(--pick-bg); }
.wrow .st { width: 24px; height: 24px; border: 2px solid var(--line); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.wrow .st.on { background: var(--good); border-color: var(--good); }
.wrow .st svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.wrow .w { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; overflow-wrap: anywhere; }
.wrow .i { color: var(--muted); font-size: 0.95rem; margin-left: 8px; font-weight: 400; font-family: var(--f-body); }
.wrow .t { color: var(--ink); }
.wdet { padding: 0 14px 14px 52px; }
.wdet .e { font-size: 1.05rem; }
.wdet .r { color: var(--muted); font-size: 0.95rem; }
.wdet .tag { margin-top: 8px; }

/* Список тестов и текстов */
.list { list-style: none; margin: 0; padding: 0; border: 2px solid var(--edge); border-radius: 6px; background: var(--surface); overflow: hidden; }
.list li + li { border-top: 1.5px solid var(--line); }
.list button { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 16px; background: none; border: 0; text-align: left; }
.list button:active { background: var(--pick-bg); }
.list .l-t { font-weight: 700; }
.done-mark { color: var(--good); font-weight: 700; white-space: nowrap; font-size: 0.9rem; }

/* Колонна скважины (уровни) */
.well { border: 2px solid var(--edge); border-radius: 6px; overflow: hidden; background: var(--surface); }
.well-row { display: grid; grid-template-columns: 84px 1fr; }
.well-row + .well-row { border-top: 1.5px solid var(--edge); }
.rock { position: relative; display: flex; justify-content: center; background: repeating-linear-gradient(135deg, var(--rock-a) 0 5px, var(--rock-b) 5px 10px); border-right: 2px solid var(--edge); }
.bore { position: relative; width: var(--w); align-self: stretch; background: var(--bore-void); border-left: 4px solid var(--steel); border-right: 4px solid var(--steel); }
.bore .fill { position: absolute; left: 0; right: 0; top: 0; height: 0; background: var(--bore-fill); border-bottom: 5px solid var(--accent); transition: height 1.1s cubic-bezier(.3,.7,.2,1); }
.well-row.zero .fill { border-bottom-width: 0; }
.well-body { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.well-body .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.well-body .h h3 { font-size: 1.6rem; }
.well-body .h .pct { flex: none; }
.well-body .pct { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.well-body .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pill { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border: 2px solid var(--edge); border-radius: 4px; background: var(--accent); color: var(--on-accent); }

/* Прогресс */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); padding: 12px 14px; }
.stat .n { font-family: var(--f-display); font-weight: 700; font-size: 1.8rem; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 0.9rem; }
.wl { display: grid; gap: 12px; }
.wl .r { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; }
.wl .r b { font-family: var(--f-display); font-size: 1.15rem; }
.wl .r span { font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
.journal { list-style: none; margin: 0; padding: 0; }
.journal li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1.5px dashed var(--line); }
.journal li:last-child { border-bottom: 0; }
.journal .d { font-weight: 600; }
.journal .s { font-family: var(--f-display); font-weight: 700; white-space: nowrap; }
.journal .k { color: var(--muted); font-size: 0.9rem; grid-column: 1 / -1; }

/* Результаты */
.res-total { font-family: var(--f-display); font-weight: 700; font-size: 3rem; line-height: 1; }
.res-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1.5px dashed var(--line); }
.res-row:last-child { border-bottom: 0; }
.res-row b { font-family: var(--f-display); font-size: 1.15rem; }

/* Диалог */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 18, 22, 0.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
.dialog { width: 100%; max-width: 420px; background: var(--surface); border: 2px solid var(--edge); border-radius: 6px; padding: 20px; }
.dialog h2 { margin-bottom: 8px; }
.dialog .btn-row { margin-top: 18px; }

.toast-warn { font-size: 0.9rem; color: var(--muted); margin-top: 24px; }

@media (min-width: 640px) {
  h1 { font-size: 2.4rem; }
  .hello h1 { font-size: 3rem; }
  .well-row { grid-template-columns: 110px 1fr; }
}
@media (max-width: 359px) {
  .wcard .word { font-size: 2.2rem; }
  .lvl-btn { font-size: 1.1rem; }
  .hello h1 { font-size: 2rem; }
  .btn { font-size: 1.1rem; }
}
@media (prefers-reduced-motion: reduce) {

      q = { prompt: w.w, plang: 'en', olang: 'ru', sub: 'Выберите перевод', opts, a: opts.indexOf(w.ru) };
    } else if (k === 'ruen') {
      opts = shuffle([w.w].concat(distract(all, w, 'w', 3)));
      q = { prompt: w.ru, plang: 'ru', olang: 'en', sub: 'Как это будет по-английски?', opts, a: opts.indexOf(w.w) };
    } else {
      opts = shuffle([w.w].concat(distract(all, w, 'w', 3)));
      q = { prompt: null, promptHtml: gapOf(w.ex), plang: 'en', olang: 'en', long: true, sub: 'Перевод: ' + w.exRu, opts, a: opts.indexOf(w.w) };
    }
    q.kind = 'mcq'; q.wid = w.id; q.why = whyWord(w);
    return q;
  });
  const seen = new Set();
  const four = shuffle(targets).filter((w) => { if (seen.has(w.ru)) return false; seen.add(w.ru); return true; }).slice(0, 4);
  const pairs = four.map((w) => ({ id: w.id, l: w.w, r: w.ru }));
  qs.push({ kind: 'match', pairs, sub: 'Нажмите слово, затем его перевод' });
  return qs;
}

function initQ() {
  const Q = UI.quiz, q = Q.qs[Q.i];

    const n = q.pairs.length;
    Q.m = { lorder: shuffle([...Array(n).keys()]), rorder: shuffle([...Array(n).keys()]), sel: null, done: new Set(), mistakes: 0, bad: new Set(), flash: null };

function quizHTML() {
  const Q = UI.quiz, q = Q.qs[Q.i], n = Q.qs.length;

  h += '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + Q.i + '"><i style="width:' + (Q.i / n * 100) + '%"></i></div>';
  h += '<div style="margin-top:20px">';
  if (q.ctx) h += q.ctx;
  if (q.kind === 'match') return h + matchHTML(Q, q) + '</div>';
  const promptInner = q.promptHtml !== undefined ? q.promptHtml : esc(q.prompt);
  h += '<div class="q-prompt' + (q.long ? ' long' : '') + '" lang="' + (q.plang || 'en') + '">' + promptInner + '</div>';
  if (q.sub) h += '<div class="q-sub">' + esc(q.sub) + '</div>';
  h += '<div class="opts" lang="' + (q.olang || 'en') + '">';
  q.opts.forEach((t, i) => {
    let cls = 'opt', mark = '', dis = '';
    if (Q.picked !== null) {
      if (Q.silent) { if (i === Q.picked) cls += ' picked'; }
      else {
        dis = ' disabled';
        if (i === q.a) { cls += ' right'; mark = 'верно'; }
        else if (i === Q.picked) { cls += ' wrong'; mark = 'ошибка'; }
      }
    }
    h += '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + dis + '><span>' + esc(t) + '</span>' + (mark ? '<span class="mark">' + mark + '</span>' : '') + '</button>';
  });
  h += '</div>';
  if (Q.picked !== null && !Q.silent) {
    const ok = Q.picked === q.a;
    h += '<div class="fb ' + (ok ? 'ok' : 'no') + '" role="status"><div class="t">' + (ok ? 'Верно!' : 'Неверно') + '</div>' +
      (ok ? '' : '<p>Правильный ответ: <b lang="' + (q.olang || 'en') + '">' + esc(q.opts[q.a]) + '</b></p>') + (q.why || '') + '</div>';
  }
  const last = Q.i + 1 === n;
  const canNext = Q.picked !== null;
  if (!Q.silent && !canNext) return h + '</div>';
  h += '<div style="margin-top:18px"><button class="btn" data-act="qnext"' + (canNext ? '' : ' disabled') + '>' + (last ? esc(Q.doneLabel) : 'Дальше') + '</button></div>';
  return h + '</div>';
}
function matchHTML(Q, q) {
  const m = Q.m;
  let h = '<div class="q-prompt" style="font-size:1.4rem">Соедините слова с переводами</div><div class="q-sub">' + esc(q.sub) + '</div>';
  h += '<div class="match"><div class="col" lang="en">';
  m.lorder.forEach((i) => {
    let cls = 'mbtn', dis = '';
    if (m.done.has(i)) { cls += ' done'; dis = ' disabled'; }
    else if (m.sel === i) cls += ' sel';
    if (m.flash && m.flash.l === i) cls += ' flash';
    h += '<button class="' + cls + '" data-act="mleft" data-i="' + i + '"' + dis + ' aria-pressed="' + (m.sel === i) + '">' + esc(q.pairs[i].l) + '</button>';
  });
  h += '</div><div class="col" lang="ru">';
  m.rorder.forEach((j) => {
    let cls = 'mbtn', dis = '';
    if (m.done.has(j)) { cls += ' done'; dis = ' disabled'; }
    if (m.flash && m.flash.r === j) cls += ' flash';
    h += '<button class="' + cls + '" data-act="mright" data-i="' + j + '"' + dis + '>' + esc(q.pairs[j].r) + '</button>';
  });
  h += '</div></div>';
  if (Q.picked === 'done') {
    const ok = m.mistakes === 0;
    h += '<div class="fb ' + (ok ? 'ok' : 'no') + '" role="status"><div class="t">' + (ok ? 'Все пары верны!' : 'Пары собраны') + '</div>' +
      (ok ? '' : '<p>Ошибок при выборе: ' + m.mistakes + '.</p>') + '</div>';
    h += '<div style="margin-top:18px"><button class="btn" data-act="qnext">' + (Q.i + 1 === Q.qs.length ? esc(Q.doneLabel) : 'Дальше') + '</button></div>';
  }
  return h;
}
function nextQ() {
  const Q = UI.quiz, q = Q.qs[Q.i];
  let ok;
  if (q.kind === 'match') {
    ok = Q.m.mistakes === 0;
    q.pairs.forEach((p, idx) => touchWord(p.id, !Q.m.bad.has(idx)));
  } else {
    ok = Q.picked === q.a;
    if (q.wid) touchWord(q.wid, ok);
  }
  Q.res.push({ ok, lvl: q.lvl });
  if (Q.i + 1 < Q.qs.length) {
    Q.i++; initQ(); render(); window.scrollTo(0, 0); focusMain();
  } else {
    save();
    Q.done(Q.res);
  }
}

function render() {
  let body = '';
  switch (UI.screen) {
    case 'home': body = homeHTML(); break;
    case 'lesson': body = lessonHTML(); break;
    case 'quiz': body = '<div class="stack">' + quizHTML() + '</div>'; break;
    case 'dict': body = dictHTML(); break;
    case 'tests': body = testsHTML(); break;
    case 'levels': body = levelsHTML(); break;
    case 'grammar': body = grammarHTML(); break;
    case 'gdetail': { const g = GRAM_BY_ID[UI.gram]; body = gramHTML(g, 'gpractice', 'К упражнению'); break; }
    case 'reader': body = readingHTML(TEXTS_BY_ID[UI.reader], 'rtasks', 'Перейти к заданиям'); break;
    case 'simple': body = simpleHTML(); break;
    case 'placeres': body = placeresHTML(); break;
    case 'progress': body = progressHTML(); break;
    default: body = homeHTML();
  }
  $app.innerHTML = headerHTML() + '<div class="wrap"><main id="view" tabindex="-1">' + body + '</main></div>' + dialogHTML();
  if (UI.screen === 'levels') {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('.fill').forEach((f) => { f.style.height = f.dataset.p + '%'; });
    }));
  }
  if (UI.scrollFb) {
    UI.scrollFb = false;
    const el = document.querySelector('.fb') || document.querySelector('[data-act="qnext"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }
}

/* ---------- Действия ---------- */
const BACK = { lesson: 'home', dict: 'home', tests: 'home', levels: 'home', grammar: 'home', progress: 'home', placeres: 'home', reader: 'tests', gdetail: 'grammar' };
function leave() {
  const to = UI.screen === 'quiz' && UI.quiz ? UI.quiz.back : UI.screen === 'simple' && UI.simple ? UI.simple.back : (BACK[UI.screen] || 'home');
  UI.quiz = null; UI.lesson = null;
  go(to);
}
const ACT = {
  nav(el) { go(el.dataset.s); },
  home() { UI.quiz = null; UI.lesson = null; go('home'); },
  back() {
    const running = (UI.screen === 'quiz' && UI.quiz) || (UI.screen === 'lesson' && UI.lesson && UI.lesson.step !== 'result');
    if (running) confirmDlg({ title: 'Выйти из занятия?', text: 'Результаты этого занятия не сохранятся.', ok: 'Выйти', cancel: 'Остаться' });
    else leave();
  },
  'dlg-ok'() {
    const d = UI.dialog;
    UI.dialog = null;
    if (d && d.onOk) d.onOk(); else leave();
  },
  'dlg-cancel'() { UI.dialog = null; render(); },
  'dlg-cancel-bg'(el, e) { if (e.target === el) { UI.dialog = null; render(); } },
  startlesson() { startLesson(); },
  lstart() { UI.lesson.step = 'words'; UI.lesson.wi = 0; go('lesson'); },
  wprev() { if (UI.lesson.wi > 0) { UI.lesson.wi--; render(); window.scrollTo(0, 0); } },
  wnext() { const Ls = UI.lesson; if (Ls.wi + 1 < Ls.words.length) { Ls.wi++; render(); window.scrollTo(0, 0); } else lessonToTest(); },
  ltasks() { lessonToTasks(); },
  lgram() { lessonToGramTask(); },
  toggletr() { UI.tr = !UI.tr; render(); },
  pick(el) {
    const Q = UI.quiz;
    if (!Q || (Q.picked !== null && !Q.silent)) return;
    Q.picked = Number(el.dataset.i);
    UI.scrollFb = true;
    render();
  },
  qnext() { if (UI.quiz && UI.quiz.picked !== null) nextQ(); },
  mleft(el) {
    const m = UI.quiz && UI.quiz.m; if (!m || m.flash) return;
    const i = Number(el.dataset.i);
    m.sel = m.sel === i ? null : i;
    render();
  },
  mright(el) {
    const Q = UI.quiz, m = Q && Q.m; if (!m || m.flash) return;
    if (m.sel === null) return;
    const j = Number(el.dataset.i), q = Q.qs[Q.i];
    if (m.sel === j) {
      m.done.add(j); m.sel = null;
      if (m.done.size === q.pairs.length) { Q.picked = 'done'; UI.scrollFb = true; }
      render();
    } else {
      m.mistakes++; m.bad.add(m.sel); m.flash = { l: m.sel, r: j }; m.sel = null;
      render();
      setTimeout(() => { if (UI.quiz === Q && Q.m === m) { m.flash = null; render(); } }, 500);
    }
  },
  setstudy(el) { S.study = el.dataset.l; save(); render(); },
  setlevel(el) { S.level = el.dataset.l; S.study = el.dataset.l; save(); render(); },
  dtopic(el) { UI.dict.topic = el.dataset.v; UI.dict.open = null; render(); },
  dstatus(el) { UI.dict.status = el.dataset.v; UI.dict.open = null; render(); },
  wopen(el) { UI.dict.open = UI.dict.open === el.dataset.id ? null : el.dataset.id; updateDictList(); },
  placement() { startPlacement(); },
  startwordtest() { startWordTest(); },
  readtext(el) { UI.reader = el.dataset.id; UI.tr = false; go('reader'); },
  rtasks() { startReaderTasks(); },
  gopen(el) { UI.gram = el.dataset.id; go('gdetail'); },
  gpractice() { startGramPractice(); },
  simpleback() { const to = UI.simple.back; UI.quiz = null; go(to); },
  reset() {
    confirmDlg({ title: 'Сбросить весь прогресс?', text: 'Будут удалены изученные слова, результаты тестов, дни занятий и определённый уровень. Это нельзя отменить.', ok: 'Сбросить', cancel: 'Отмена', danger: true, onOk: () => { S = blank(); save(); UI.dict = { topic: 'all', status: 'all', q: '', open: null }; go('home'); } });
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'dsearch') { UI.dict.q = e.target.value; updateDictList(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UI.dialog) { UI.dialog = null; render(); }
});

render();
})();

</script>
</body>
</html>
